name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you deploy from any branch to preview before merging.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a live one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A case with no pivot is unwinnable and fails silently in the browser,
      # so this gates the deploy rather than merely reporting.
      - run: node tools/validate-cases.mjs

  browser:
    name: Browser suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Deliberately not --with-deps. That flag makes Playwright shell out to
      # apt-get, which refreshes every repo configured on the runner image --
      # including Google's Chrome deb repo, which is third-party and outside
      # this project's control. On 9 September 2026 that repo served a
      # Packages.gz whose hash did not match its own Release file, apt failed
      # the whole transaction, and a static-site deploy was blocked by a broken
      # mirror it has no reason to touch. The hosted ubuntu runner already ships
      # Chrome and Chromium, so the shared libraries Playwright's browser needs
      # are present; only the browser binary is missing, and that comes from
      # Playwright's own CDN. If a library ever is genuinely absent the suite
      # fails loudly at browser launch, which is a real signal rather than a
      # silent pass.
      - run: npx playwright install chromium
      - name: Serve and test
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/index.html >/dev/null && break
            sleep 1
          done
          node tools/smoke-test.mjs

  deploy:
    name: Deploy
    needs: [validate, browser]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Everything the published site is made of -- which pages and which
      # cases, and the cache-busting stamp on every asset URL -- lives in
      # tools/build-site.mjs, not in this step. It used to be shell here, where
      # a sed escaping bug that would have broken the deploy was caught only by
      # dry-running it by hand. The script fails loudly if any of it slips:
      # play.html and src/cases.json (the full 48-case deck, unpublished cases
      # included) must not reach _site, and every asset must carry the commit.
      - name: Assemble site
        run: node tools/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
